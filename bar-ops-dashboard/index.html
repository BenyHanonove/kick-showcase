    <script>
      // Purge any legacy service worker + its caches.
      // Safari disables service workers in Private Browsing but keeps them in
      // normal windows, so a stale SW can serve broken cached assets there and
      // leave the app unable to open. Unregister the SW, delete its caches, and
      // reload once when the current page is actually being controlled by it.
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var RELOAD_FLAG = 'sw-cleanup-reloaded';
        // A controller means this document was served through a legacy SW, so
        // the assets in flight may already be stale/broken.
        var controlled = !!navigator.serviceWorker.controller;

        function unregisterAll() {
          return navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              return Promise.all(
                registrations.map(function (r) {
                  return r.unregister();
                }),
              );
            })
            .catch(function () {});
        }

        function deleteCaches() {
          if (!('caches' in window)) return Promise.resolve();
          return caches
            .keys()
            .then(function (keys) {
              return Promise.all(
                keys.map(function (key) {
                  return caches.delete(key);
                }),
              );
            })
            .catch(function () {});
        }

        Promise.all([unregisterAll(), deleteCaches()]).then(function () {
          // Reload once (per tab) so the fresh, network-served build takes over.
          if (controlled) {
            var alreadyReloaded;
            try {
              alreadyReloaded = sessionStorage.getItem(RELOAD_FLAG);
              sessionStorage.setItem(RELOAD_FLAG, '1');
            } catch (e) {
              // sessionStorage unavailable: fall back to a single reload attempt.
            }
            if (!alreadyReloaded) window.location.reload();
          }
        });
      })();
    </script>
    <script>
      // Recover from a build chunk that fails to load.
      //
      // For a few seconds after a deploy an /assets/ chunk may not have reached
      // every edge location yet, so it 404s, the module graph never resolves and
      // the app renders nothing. The same happens when a browser replays a stale
      // index.html naming chunks the current build no longer emits.
      //
      // Reloading fetches a fresh index.html with current chunk names, which is
      // all the recovery either case needs. Resource errors do not bubble, so
      // the listener has to run in the capture phase.
      (function () {
        var RELOAD_STAMP = 'asset-recovery-reloaded-at';
        // Long enough that a reload landing on the same failure gives up rather
        // than looping, short enough that a later failure can still recover.
        var COOLDOWN_MS = 10000;

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || el === window) return;

            // Only act on a failed build asset, not on runtime script errors.
            var tag = el.tagName;
            if (tag !== 'SCRIPT' && tag !== 'LINK') return;
            var url = el.src || el.href || '';
            if (url.indexOf('/assets/') === -1) return;

            var last = 0;
            try {
              last = parseInt(sessionStorage.getItem(RELOAD_STAMP) || '0', 10) || 0;
            } catch (e) {
              // sessionStorage unavailable: treat as never reloaded.
            }
            // Already retried moments ago, so the build is genuinely broken.
            if (Date.now() - last < COOLDOWN_MS) return;

            try {
              sessionStorage.setItem(RELOAD_STAMP, String(Date.now()));
            } catch (e) {
              // Ignore: a reload without the stamp still beats a blank page.
            }
            window.location.reload();
          },
          true,
        );
      })();
    </script>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #181513 0%, #0d0c0b 100%);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 24px;
      }

      .app-splash-glow {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168, 80, 56, 0.22) 0%, rgba(229, 144, 116, 0.08) 45%, transparent 70%);
        filter: blur(32px);
        pointer-events: none;
        animation: splash-glow-breathe 2.4s ease-in-out infinite alternate;
      }

      .app-splash-logo-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-float 2.6s ease-in-out infinite alternate;
      }

      .app-splash-logo {
        width: clamp(140px, 34vw, 220px);
        height: auto;
        color: #ffffff;
        filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 15px rgba(229, 144, 116, 0.25));
        transition: transform 0.3s ease;
      }

      .app-splash-track {
        position: relative;
        z-index: 1;
        width: clamp(110px, 25vw, 150px);
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 28px;
      }

      .app-splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #a85038, #e59074, #ffffff, #e59074, #a85038, transparent);
        animation: splash-progress 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      #app-splash.app-splash-fade {
        opacity: 0;
        transform: scale(1.02);
        filter: blur(4px);
        pointer-events: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes splash-glow-breathe {
        0% { transform: scale(0.85); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.95; }
      }

      @keyframes splash-float {
        0% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.015); }
        100% { transform: translateY(0) scale(1); }
      }

      @keyframes splash-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash-glow,
        .app-splash-logo-wrap,
        .app-splash-bar {
          animation: none !important;
        }
        #app-splash.app-splash-fade {
          transition: opacity 0.2s ease;
        }
      }
    </style>

    <script>
      // Failsafe: dismiss splash after 6 seconds if app mount is unexpectedly delayed
      setTimeout(function () {
        var s = document.getElementById('app-splash');
        if (s && !s.classList.contains('app-splash-fade')) {
          s.classList.add('app-splash-fade');
          setTimeout(function () { s.remove(); }, 450);
        }
      }, 6000);
    </script>
