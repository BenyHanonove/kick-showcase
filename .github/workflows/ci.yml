name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard (type-check, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-ops-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: bar-ops-dashboard/.node-version
          cache: npm
          cache-dependency-path: bar-ops-dashboard/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  api:
    name: API (typecheck, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-ops-api-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bar-ops-api-v3/package-lock.json
      # --ignore-scripts: no SST/Pulumi provider downloads; CI never deploys
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
